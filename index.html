<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Conferência</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         LOGIN
    =================================================== -->

    <div
        id="telaLogin"
        class="container"
    >

        <div class="card">

            <h1>Sistema de Conferência</h1>

            <p class="subtitulo">
                Acesso do conferente
            </p>


            <div class="campo">

                <label for="conferente">
                    Conferente
                </label>

                <select id="conferente">

                    <option value="">
                        Carregando conferentes...
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                >

            </div>


            <button
                id="btnEntrar"
                type="button"
            >
                Entrar
            </button>


            <div
                id="statusLogin"
                class="status"
            ></div>

        </div>

    </div>



    <!-- ==================================================
         SISTEMA
    =================================================== -->

    <div
        id="telaSistema"
        class="container"
        style="display: none;"
    >

        <div class="card">


            <!-- CABEÇALHO -->

            <div class="cabecalhoSistema">

                <div>

                    <h1>
                        Conferência
                    </h1>

                    <p>
                        Conferente:
                        <strong
                            id="nomeConferente"
                        ></strong>
                    </p>

                </div>


                <button
                    id="btnSair"
                    type="button"
                >
                    Sair
                </button>

            </div>



            <!-- ==================================================
                 PEDIDO
            =================================================== -->

            <section>

                <h2>
                    1. Pedido
                </h2>

                <div class="campo">

                    <label for="pedido">
                        Número do pedido
                    </label>

                    <input
                        type="text"
                        id="pedido"
                        placeholder="Digite ou escaneie o pedido"
                        autocomplete="off"
                    >

                </div>


                <button
                    id="btnBuscarPedido"
                    type="button"
                >
                    Buscar pedido
                </button>

            </section>



            <!-- ==================================================
                 RESULTADO
            =================================================== -->

            <section
                id="secaoResultado"
                style="display: none;"
            >

                <h2>
                    2. A separação está correta?
                </h2>


                <p>
                    Informe se encontrou algum erro na separação.
                </p>


                <div class="botoesResultado">

                    <button
                        id="btnSemErro"
                        type="button"
                    >
                        ✓ Sim, está correta
                    </button>


                    <button
                        id="btnComErro"
                        type="button"
                    >
                        ✕ Não, encontrei um erro
                    </button>

                </div>

            </section>



            <!-- ==================================================
                 REGISTRO SEM ERRO
            =================================================== -->

            <section>

                <button
                    id="btnRegistrarSemErro"
                    type="button"
                    style="display: none;"
                >
                    Registrar separação correta
                </button>

            </section>



            <!-- ==================================================
                 ERRO
            =================================================== -->

            <section
                id="secaoErro"
                style="display: none;"
            >

                <h2>
                    3. Dados do erro
                </h2>


                <!-- SKU -->

                <div class="campo">

                    <label for="sku">
                        SKU / Produto
                    </label>

                    <input
                        type="text"
                        id="sku"
                        placeholder="Digite ou escaneie o SKU"
                        autocomplete="off"
                    >

                </div>


                <!-- QUANTIDADE SOLICITADA -->

                <div class="campo">

                    <label for="qtdSolicitada">
                        Quantidade solicitada
                    </label>

                    <input
                        type="number"
                        id="qtdSolicitada"
                        min="0"
                        step="1"
                        placeholder="Quantidade"
                    >

                </div>


                <!-- QUANTIDADE SEPARADA -->

                <div class="campo">

                    <label for="qtdSeparada">
                        Quantidade separada
                    </label>

                    <input
                        type="number"
                        id="qtdSeparada"
                        min="0"
                        step="1"
                        placeholder="Quantidade"
                    >

                </div>


                <button
                    id="btnAdicionarItem"
                    type="button"
                >
                    Adicionar SKU
                </button>


                <!-- LISTA DOS SKUS -->

                <div
                    id="listaItens"
                ></div>


                <!-- TIPO DE ERRO -->

                <div class="campo">

                    <label for="tipoErro">
                        Tipo de erro
                    </label>

                    <select id="tipoErro">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Quantidade">
                            Quantidade
                        </option>

                        <option value="Produto">
                            Produto
                        </option>

                        <option value="SKU">
                            SKU
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                </div>


                <!-- GRAVIDADE -->

                <div class="campo">

                    <label for="gravidade">
                        Gravidade
                    </label>

                    <select id="gravidade">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Baixa">
                            Baixa
                        </option>

                        <option value="Média">
                            Média
                        </option>

                        <option value="Alta">
                            Alta
                        </option>

                    </select>

                </div>


                <!-- AÇÃO -->

                <div class="campo">

                    <label for="acaoTomada">
                        Ação tomada
                    </label>

                    <input
                        type="text"
                        id="acaoTomada"
                        placeholder="Informe a ação tomada"
                    >

                </div>


                <!-- OBSERVAÇÃO -->

                <div class="campo">

                    <label for="observacao">
                        Observação
                    </label>

                    <textarea
                        id="observacao"
                        rows="4"
                        placeholder="Digite uma observação"
                    ></textarea>

                </div>


                <!-- REGISTRAR ERRO -->

                <button
                    id="btnRegistrarComErro"
                    type="button"
                >
                    Registrar erro
                </button>

            </section>



            <!-- STATUS -->

            <div
                id="statusSistema"
                class="status"
            ></div>


        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
