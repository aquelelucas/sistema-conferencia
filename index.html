<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Conferência</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ========================================= -->
    <!-- TELA DE LOGIN -->
    <!-- ========================================= -->

    <div
        id="telaLogin"
        class="container"
    >

        <div class="card">

            <h1>Sistema de Conferência</h1>

            <p>
                Acesso do conferente
            </p>


            <label for="conferente">
                Conferente
            </label>

            <select id="conferente">

                <option value="">
                    Carregando conferentes...
                </option>

            </select>


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >


            <button
                id="btnEntrar"
                type="button"
            >
                Entrar
            </button>


            <div
                id="statusLogin"
                class="status"
            ></div>

        </div>

    </div>



    <!-- ========================================= -->
    <!-- TELA DE CONFERÊNCIA -->
    <!-- ========================================= -->

    <div
        id="telaConferencia"
        class="container"
        style="display: none;"
    >

        <div class="card">

            <div class="topo">

                <div>

                    <h1>
                        Conferência
                    </h1>

                    <p>
                        Conferente:
                        <strong id="nomeConferente"></strong>
                    </p>

                </div>


                <button
                    id="btnSair"
                    type="button"
                >
                    Sair
                </button>

            </div>



            <!-- ================================= -->
            <!-- PEDIDO -->
            <!-- ================================= -->

            <section>

                <h2>
                    Pedido
                </h2>


                <label for="pedido">
                    Número do pedido
                </label>


                <div class="linha">

                    <input
                        type="text"
                        id="pedido"
                        placeholder="Digite ou escaneie o pedido"
                    >


                    <button
                        id="btnBuscarPedido"
                        type="button"
                    >
                        Buscar pedido
                    </button>

                </div>

            </section>



            <!-- ================================= -->
            <!-- ITENS -->
            <!-- ================================= -->

            <section
                id="secaoItens"
                style="display: none;"
            >

                <h2>
                    Itens da conferência
                </h2>


                <label for="sku">
                    SKU / Produto
                </label>

                <input
                    type="text"
                    id="sku"
                    placeholder="Digite ou escaneie o SKU"
                >


                <label for="qtdSolicitada">
                    Quantidade solicitada
                </label>

                <input
                    type="number"
                    id="qtdSolicitada"
                    min="0"
                >


                <label for="qtdSeparada">
                    Quantidade separada
                </label>

                <input
                    type="number"
                    id="qtdSeparada"
                    min="0"
                >


                <button
                    id="btnAdicionarItem"
                    type="button"
                >
                    Adicionar item
                </button>


                <div id="listaItens"></div>

            </section>



            <!-- ================================= -->
            <!-- RESULTADO -->
            <!-- ================================= -->

            <section
                id="secaoResultado"
                style="display: none;"
            >

                <h2>
                    Resultado
                </h2>


                <button
                    id="btnSemErro"
                    type="button"
                >
                    Conferência sem erro
                </button>


                <button
                    id="btnComErro"
                    type="button"
                >
                    Conferência com erro
                </button>

            </section>



            <!-- ================================= -->
            <!-- ERRO -->
            <!-- ================================= -->

            <section
                id="secaoErro"
                style="display: none;"
            >

                <h2>
                    Dados do erro
                </h2>


                <label for="tipoErro">
                    Tipo de erro
                </label>

                <select id="tipoErro">

                    <option value="">
                        Selecione
                    </option>

                    <option value="Quantidade">
                        Quantidade
                    </option>

                    <option value="Produto">
                        Produto
                    </option>

                    <option value="SKU">
                        SKU
                    </option>

                    <option value="Avaria">
                        Avaria
                    </option>

                    <option value="Validade">
                        Validade
                    </option>

                    <option value="Outro">
                        Outro
                    </option>

                </select>


                <label for="gravidade">
                    Gravidade
                </label>

                <select id="gravidade">

                    <option value="">
                        Selecione
                    </option>

                    <option value="Baixa">
                        Baixa
                    </option>

                    <option value="Média">
                        Média
                    </option>

                    <option value="Alta">
                        Alta
                    </option>

                </select>


                <label for="acaoTomada">
                    Ação tomada
                </label>

                <input
                    type="text"
                    id="acaoTomada"
                    placeholder="Informe a ação tomada"
                >


                <label for="observacao">
                    Observação
                </label>

                <textarea
                    id="observacao"
                    placeholder="Observações adicionais"
                ></textarea>


            </section>



            <!-- ================================= -->
            <!-- BOTÕES DE REGISTRO -->
            <!-- ================================= -->

            <button
                id="btnRegistrarSemErro"
                type="button"
                style="display: none;"
            >
                Registrar conferência sem erro
            </button>


            <button
                id="btnRegistrarComErro"
                type="button"
                style="display: none;"
            >
                Registrar conferência com erro
            </button>


        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
