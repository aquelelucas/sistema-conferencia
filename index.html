<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Conferência</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- =========================
             TELA DE LOGIN
        ========================== -->

        <section id="telaLogin" class="card">

            <div class="cabecalho">
                <h1>Sistema de Conferência</h1>
                <p>Identificação do conferente</p>
            </div>

            <div class="campo">
                <label for="conferente">
                    Conferente
                </label>

                <select id="conferente">
                    <option value="">
                        Carregando conferentes...
                    </option>
                </select>
            </div>

            <div class="campo">
                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                >
            </div>

            <button
                type="button"
                id="btnEntrar"
                class="btn principal"
            >
                Entrar
            </button>

            <div
                id="statusLogin"
                class="status"
            ></div>

        </section>


        <!-- =========================
             TELA DO SISTEMA
        ========================== -->

        <section
            id="telaSistema"
            class="card"
            style="display: none;"
        >

            <header class="topo-sistema">

                <div>
                    <h1>Conferência</h1>

                    <p>
                        Conferente:
                        <strong id="nomeConferente"></strong>
                    </p>
                </div>

                <button
                    type="button"
                    id="btnSair"
                    class="btn secundario"
                >
                    Sair
                </button>

            </header>


            <!-- =========================
                 PEDIDO
            ========================== -->

            <section class="etapa">

                <h2>1. Informe o pedido</h2>

                <div class="linha-pedido">

                    <input
                        type="text"
                        id="pedido"
                        placeholder="Digite ou escaneie o pedido"
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        id="btnBuscarPedido"
                        class="btn principal"
                    >
                        Buscar pedido
                    </button>

                </div>

            </section>


            <!-- =========================
                 RESULTADO
            ========================== -->

            <section
                id="secaoResultado"
                class="etapa"
                style="display: none;"
            >

                <h2>2. A separação está correta?</h2>

                <div class="botoes-escolha">

                    <button
                        type="button"
                        id="btnSemErro"
                        class="btn correto"
                    >
                        ✓ Sim, está correta
                    </button>

                    <button
                        type="button"
                        id="btnComErro"
                        class="btn erro"
                    >
                        ✕ Não, encontrei um erro
                    </button>

                </div>


                <!-- REGISTRO SEM ERRO -->

                <button
                    type="button"
                    id="btnRegistrarSemErro"
                    class="btn registrar"
                    style="display: none;"
                >
                    Registrar conferência
                </button>


                <!-- =========================
                     REGISTRO COM ERRO
                ========================== -->

                <section
                    id="secaoErro"
                    class="subsecao"
                    style="display: none;"
                >

                    <h3>Itens com erro</h3>

                    <p class="ajuda">
                        Informe cada SKU que apresentou erro
                        na separação.
                    </p>


                    <!-- SKU -->

                    <div class="campo">

                        <label for="sku">
                            SKU / Produto
                        </label>

                        <input
                            type="text"
                            id="sku"
                            placeholder="Informe ou escaneie o SKU"
                            autocomplete="off"
                        >

                    </div>


                    <!-- QUANTIDADES -->

                    <div class="grid-quantidades">

                        <div class="campo">

                            <label for="qtdSolicitada">
                                Qtd. solicitada
                            </label>

                            <input
                                type="number"
                                id="qtdSolicitada"
                                min="0"
                                step="any"
                                placeholder="0"
                            >

                        </div>


                        <div class="campo">

                            <label for="qtdSeparada">
                                Qtd. separada
                            </label>

                            <input
                                type="number"
                                id="qtdSeparada"
                                min="0"
                                step="any"
                                placeholder="0"
                            >

                        </div>

                    </div>


                    <button
                        type="button"
                        id="btnAdicionarItem"
                        class="btn secundario"
                    >
                        + Adicionar SKU
                    </button>


                    <!-- LISTA DE ITENS -->

                    <div
                        id="listaItens"
                        class="lista-itens"
                    >
                        <p class="lista-vazia">
                            Nenhum item adicionado.
                        </p>
                    </div>


                    <!-- DETALHES DO ERRO -->

                    <div class="campo">

                        <label for="tipoErro">
                            Tipo de erro
                        </label>

                        <select id="tipoErro">

                            <option value="">
                                Selecione o tipo de erro
                            </option>

                            <option value="Quantidade incorreta">
                                Quantidade incorreta
                            </option>

                            <option value="Produto incorreto">
                                Produto incorreto
                            </option>

                            <option value="SKU incorreto">
                                SKU incorreto
                            </option>

                            <option value="Produto faltante">
                                Produto faltante
                            </option>

                            <option value="Produto excedente">
                                Produto excedente
                            </option>

                            <option value="Outro">
                                Outro
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="gravidade">
                            Gravidade
                        </label>

                        <select id="gravidade">

                            <option value="">
                                Selecione a gravidade
                            </option>

                            <option value="Baixa">
                                Baixa
                            </option>

                            <option value="Média">
                                Média
                            </option>

                            <option value="Alta">
                                Alta
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="acaoTomada">
                            Ação tomada
                        </label>

                        <input
                            type="text"
                            id="acaoTomada"
                            placeholder="Informe a ação tomada"
                        >

                    </div>


                    <div class="campo">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            rows="3"
                            placeholder="Observações adicionais"
                        ></textarea>

                    </div>


                    <button
                        type="button"
                        id="btnRegistrarComErro"
                        class="btn registrar"
                        style="display: none;"
                    >
                        Registrar conferência
                    </button>

                </section>

            </section>


            <!-- STATUS -->

            <div
                id="statusSistema"
                class="status"
            ></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
